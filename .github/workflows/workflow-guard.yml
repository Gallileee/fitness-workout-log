name: workflow-guard

# Checks the workflows themselves for security mistakes (unpinned actions, token permissions,
# template injection) with https://github.com/Gallileee/workflow-guard. Findings appear as
# annotations on the changed workflow lines. Runs only when a workflow changes.
on:
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  pull_request:
    paths: [".github/workflows/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: Gallileee/workflow-guard@3823d2fc5436ec3cdcea03625e50d54c4aab4a96  # v0.15.0
